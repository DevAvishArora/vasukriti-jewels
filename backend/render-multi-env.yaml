# Render Configuration for 3 Environments
# Copy this to Render Dashboard manually for each service

services:
  # ==================== PRODUCTION ====================
  - type: web
    name: vasukriti-backend-prod
    env: node
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false  # Add manually
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Add manually
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587

  # ==================== STAGING ====================
  - type: web
    name: vasukriti-backend-staging
    env: node
    region: singapore
    plan: free
    branch: staging
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false  # Add manually
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Add manually
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false  # Use test key
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Use test secret
      - key: EMAIL_HOST
        value: smtp.ethereal.email
      - key: EMAIL_PORT
        value: 587

  # ==================== DEVELOPMENT ====================
  - type: web
    name: vasukriti-backend-dev
    env: node
    region: singapore
    plan: free
    branch: development
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false  # Add manually
      - key: JWT_SECRET
        value: dev-secret-123-change-in-production
      - key: JWT_REFRESH_SECRET
        value: dev-refresh-secret-123
      - key: FRONTEND_URL
        sync: false  # Add manually
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false  # Use test key
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Use test secret
      - key: EMAIL_HOST
        value: smtp.ethereal.email
      - key: EMAIL_PORT
        value: 587
